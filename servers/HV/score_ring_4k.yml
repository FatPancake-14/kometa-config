# Score ring (bottom-right) + 4K label (top-left). Generated by tools/build_overlays.py - edit that, not this file.
# Score: MDBList's average, stored by Kometa in Plex's user rating field (0-10) and shown here out of 100.
# No ring for: no score, fewer than 20 TMDb votes, or a perfect 100 (treated as too few votes).
overlays:
  4K Label:
    overlay:
      name: 4K Label
      file: config/overlay-images/labels/4k.png
      horizontal_align: left
      vertical_align: top
      horizontal_offset: 44
      vertical_offset: 44
    plex_all: true
  Score 1:
    overlay:
      name: Score 1
      file: config/overlay-images/ring/r01.png
      horizontal_align: right
      vertical_align: bottom
      horizontal_offset: 44
      vertical_offset: 56
      group: score
      weight: 10
    ignore_blank_results: true      # empty score bands are normal; warn instead of error
    plex_search:
      all:
        user_rating.gte: 0.05
        user_rating.lt: 0.15
    filters:
      tmdb_vote_count.gte: 20
