# Discovery rows built from the MDBList score (stored by Kometa in Plex's user rating, 0-10, so 8.0 = 80).
# Kometa labels the titles that qualify each night (smart_label); each row is then a Plex smart collection on that label
# that leaves out what the viewer has already watched (worked out per viewer) and shows 50 at random, so it
# reshuffles on every visit and never grows long. Only for libraries that have scores (the "<Library> Ratings"
# entries in config.yml).
collections:
  Rated 80+ · Not Seen Yet:
    smart_label:
      sort_by: random
      limit: 50
      all:
        label: <<smart_label>>
        unplayed: true
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true
    plex_search:
      all:
        user_rating.gte: 7.95
    filters:
      tmdb_vote_count.gte: 20
    sort_title: "!6_rated_80"
    summary: "Scored 80 or more out of 100, and you haven't watched them yet. A different 50 every visit."

  Hidden Gems:
    smart_label:
      sort_by: random
      limit: 50
      all:
        label: <<smart_label>>
        unplayed: true
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true
    plex_search:
      all:
        user_rating.gte: 7.45
    filters:
      tmdb_vote_count.gte: 20
      tmdb_vote_count.lte: 200
    sort_title: "!7_hidden_gems"
    summary: "Scored 75 or more, but few people have rated them yet. A different 50 every visit."

  Under 100 Minutes:
    smart_label:
      sort_by: random
      limit: 50
      all:
        label: <<smart_label>>
        unplayed: true
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true
    plex_search:
      all:
        user_rating.gte: 6.95
        duration.lt: 100
    filters:
      tmdb_vote_count.gte: 20
    sort_title: "!8_under_100"
    summary: "Well-rated films (70+) that are under 100 minutes, for when you don't want a long one."
