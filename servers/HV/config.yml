  # ---- Scores only (MDBList average into the user rating), no overlays yet. Same refresh tiers as the 4K libraries.
  # Plex shares a title's user rating across all its copies, so these agree with the 4K libraries' scores.
  Movies Ratings:
    library_name: Movies
    schedule:                         # score refresh tiers: first match wins
    - schedule: yearly(01/01)
      mode: full
    - schedule: monthly(1)
      mode: added(400)
    - schedule: weekly(sunday)
      mode: added(35)
    - schedule: daily
      mode: added(2)
    run_order:
    - operations
    operations:
      mass_metadata_update:
        ratings:
          user: [mdb_average, remove]   # MDBList average (stored as 0-10)
