# Discovery rows for TV, built from the MDBList score (stored in Plex's user rating, 0-10, so 8.0 = 80).
# Same approach as score_collections_movies.yml: Kometa labels what qualifies, the row is a smart collection
# on that label, unwatched by the viewer, 50 at random.
collections:
  Rated 80+ · Not Seen Yet:
    smart_label:
      sort_by: random
      limit: 50
      all:
        label: <<smart_label>>
        unplayed_episodes: true   # Plex has no 'unplayed' for shows; this means the viewer hasn't finished it
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true
    plex_search:
      all:
        user_rating.gte: 7.95
    filters:
      tmdb_vote_count.gte: 20
    sort_title: "!8_1_rated_80"
    summary: "Shows scored 80 or more out of 100 that you haven't finished. A different 50 every visit."

  Hidden Gems:
    smart_label:
      sort_by: random
      limit: 50
      all:
        label: <<smart_label>>
        unplayed_episodes: true   # Plex has no 'unplayed' for shows; this means the viewer hasn't finished it
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true
    plex_search:
      all:
        user_rating.gte: 7.45
    filters:
      tmdb_vote_count.gte: 20
      tmdb_vote_count.lte: 200
    sort_title: "!8_2_hidden_gems"
    summary: "Shows scored 75 or more that few people have rated yet. A different 50 every visit."

  Binge-able:
    smart_label:
      sort_by: random
      limit: 50
      all:
        label: <<smart_label>>
        unplayed_episodes: true   # Plex has no 'unplayed' for shows; this means the viewer hasn't finished it
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true
    plex_search:
      all:
        user_rating.gte: 7.95
    filters:
      tmdb_status: ended
      tmdb_vote_count.gte: 20
      seasons:                  # Kometa has no season-count filter: require every season to be titled 1-3 (or Specials)
        percentage: 100
        title.regex: '^(Season|Series) [1-3]$|^Specials$'
    sort_title: "!8_3_bingeable"
    summary: "Finished shows of one to three seasons, scored 80 or more. Start one knowing it has an ending."
