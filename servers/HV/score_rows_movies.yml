# Score rows for film libraries: Rated 80+, Hidden Gems, Under 100 Minutes, Best Documentaries.
# tools/sync_scores.py picks today's selection each night: 50 at random from every film that passes the
# row's rules (from MDBList: every site's score and vote count), the same all day. It tags them with a Plex
# label named after the row, and each row here is a Plex smart collection on that label, best score first.
# (No "unwatched" filter: Plex works that out from the server owner's history, not the viewer's.)
#
# template_variables (per library, in config.yml):
#   home: true          also show the rows on Home (default: the library's Recommended tab only)
#   use_gems: false     no Hidden Gems row in this library
#   use_docs: false     no Best Documentaries row in this library
# sync_scores.py reads the same switches, so the labels and the rows always match.
templates:
  score row:
    default:
      home: false
    smart_filter:
      sort_by: user_rating.desc
      all:
        label: <<collection_name>>
    visible_library: true
    visible_home: <<home>>
    visible_shared: <<home>>
    file_poster: "config/posters/<<collection_name>>.jpg"   # tools/make_collection_posters.py
  gems switch:
    default:
      use_gems: true
    run_definition: <<use_gems>>
  docs switch:
    default:
      use_docs: true
    run_definition: <<use_docs>>

collections:
  Rated 80+:
    template: {name: score row}
    sort_title: "!8_1_rated_80"
    summary: "Today's 50: films scored 80+ out of 100 by enough people, with critics and audiences in agreement. A new selection every day."

  Hidden Gems:
    template: [{name: score row}, {name: gems switch}]
    sort_title: "!8_2_hidden_gems"
    summary: "Today's selection: loved by the people who've seen them (78+), but not many have. A new selection every day."

  Under 100 Minutes:
    template: {name: score row}
    sort_title: "!8_3_under_100"
    summary: "Today's selection of well-rated films (75+) that run 75 to 99 minutes, for when you don't want a long one. A new selection every day."

  Best Documentaries:
    template: [{name: score row}, {name: docs switch}]
    sort_title: "!8_4_documentaries"
    summary: "Today's selection of the best-rated documentaries (80+). A new selection every day."
